<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="mLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00dfd8" />
      <stop offset="50%" stop-color="#0070f3" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <linearGradient id="mPhoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121826" />
      <stop offset="100%" stop-color="#0b0e17" />
    </linearGradient>
    <filter id="mGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(10, 8)">
    <!-- Glow Background -->
    <rect x="0" y="0" width="58" height="64" rx="16" fill="url(#mLogoGrad)" opacity="0.25" filter="url(#mGlow)" />
    <!-- Outer Phone Container -->
    <rect x="0" y="0" width="58" height="64" rx="16" fill="url(#mPhoneGrad)" stroke="url(#mLogoGrad)" stroke-width="2.5" />
    
    <!-- Phone Top Speaker Bar & Camera -->
    <rect x="22" y="5" width="14" height="3" rx="1.5" fill="#475569" />
    <circle cx="16" cy="6.5" r="1.5" fill="#00dfd8" />

    <!-- Broadcast Waves (Left & Right) -->
    <path d="M 12 32 A 16 16 0 0 1 12 24" stroke="#00dfd8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 8 36 A 22 22 0 0 1 8 20" stroke="#0070f3" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M 46 32 A 16 16 0 0 0 46 24" stroke="#00dfd8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 50 36 A 22 22 0 0 0 50 20" stroke="#0070f3" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Center Play & Code Diamond -->
    <path d="M 23 20 L 37 28 L 23 36 Z" fill="url(#mLogoGrad)" />
    
    <!-- Code Brackets Underneath -->
    <path d="M 19 45 L 14 49 L 19 53" stroke="#00dfd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 39 45 L 44 49 L 39 53" stroke="#7928ca" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="31" y1="44" x2="27" y2="54" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Typography Text -->
  <text x="82" y="38" font-family="'Outfit', sans-serif" font-weight="900" font-size="25" fill="#ffffff" letter-spacing="-0.5">MOBİL</text>
  <text x="160" y="38" font-family="'Outfit', sans-serif" font-weight="900" font-size="25" fill="url(#mLogoGrad)" letter-spacing="-0.5">YAZILIM</text>
  
  <text x="83" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="9.5" fill="#94a3b8" letter-spacing="1.5">CANLI YAYIN &amp; MOBİL ÇÖZÜMLER</text>
</svg>
